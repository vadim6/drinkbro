<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrinkBro — Art Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fdf6ec; color: #3b2a1a; font-family: 'Georgia', serif; min-height: 100vh; }
    header { text-align: center; padding: 80px 20px 60px; border-bottom: 1px solid #e8d5bb; }
    header h1 { font-size: 12px; letter-spacing: 0.6em; text-transform: uppercase; color: #c8834a; }
    header p { margin-top: 10px; font-size: 9px; letter-spacing: 0.4em; text-transform: uppercase; color: #c4a882; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); max-width: 1440px; margin: 0 auto; padding: 0 20px 100px; }
    .card { display: flex; flex-direction: column; align-items: center; padding: 50px 10px 36px; border: 1px solid transparent; border-top: 1px solid #e8d5bb; transition: all 0.35s ease; }
    .card:hover { background: #f5e6cc; border-color: #c4a882; }
    .card:hover .label { color: #c8834a; }
    .card svg { width: 120px; height: 120px; overflow: visible; }
    .label { margin-top: 28px; font-size: 9px; letter-spacing: 0.45em; text-transform: uppercase; color: #c8834a; transition: color 0.3s; }
    .sub { margin-top: 6px; font-size: 8px; letter-spacing: 0.25em; text-transform: uppercase; color: #c4a882; }
  </style>
</head>
<body>
<header>
  <h1>DrinkBro</h1>
  <p>The Menu, Illustrated</p>
</header>
<div class="gallery">

  <!-- ── ESPRESSO ── small white cup, golden crema, 3/4 perspective -->
  <div class="card">
    <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="espCer" cx="28%" cy="20%" r="80%">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="25%" stop-color="#F5ECD8"/>
          <stop offset="100%" stop-color="#C0A478"/>
        </radialGradient>
        <radialGradient id="espCrema" cx="32%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#F2C040"/>
          <stop offset="55%" stop-color="#C48828"/>
          <stop offset="100%" stop-color="#7A5010"/>
        </radialGradient>
        <radialGradient id="espSaucer" cx="35%" cy="28%" r="70%">
          <stop offset="0%" stop-color="#F4E8C8"/>
          <stop offset="100%" stop-color="#BCA070"/>
        </radialGradient>
      </defs>
      <!-- steam -->
      <path d="M57,80 Q61,70 57,60 Q53,50 57,40" stroke="#C8A84A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
      <path d="M73,78 Q77,68 73,58 Q69,48 73,38" stroke="#C8A84A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.35"/>
      <!-- saucer drop shadow -->
      <ellipse cx="70" cy="152" rx="50" ry="7" fill="#3b2a1a" opacity="0.08"/>
      <!-- saucer -->
      <ellipse cx="70" cy="147" rx="48" ry="8.5" fill="url(#espSaucer)"/>
      <ellipse cx="70" cy="144" rx="37" ry="6" fill="#EDE0C0"/>
      <!-- cup drop shadow -->
      <ellipse cx="70" cy="141" rx="25" ry="4" fill="#3b2a1a" opacity="0.07"/>
      <!-- cup body -->
      <path d="M46,134 Q46,142 70,144 Q94,142 94,134 L96,86 Q70,78 44,86 Z" fill="url(#espCer)"/>
      <!-- handle: filled D-ring, no stroke -->
      <path d="M94,99 Q116,99 116,109 Q116,120 94,119 L94,111 Q106,110 106,109 Q106,108 94,107 Z" fill="url(#espCer)"/>
      <!-- cup interior dark -->
      <ellipse cx="70" cy="86" rx="25" ry="7.5" fill="#1A0904"/>
      <!-- crema -->
      <ellipse cx="70" cy="86" rx="23" ry="6.5" fill="url(#espCrema)"/>
      <!-- crema swirl -->
      <path d="M59,85 Q70,82 81,85" stroke="#F5D858" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.5"/>
    </svg>
    <div class="label">Espresso</div>
    <div class="sub">Single Origin</div>
  </div>

  <!-- ── FLAT WHITE ── medium white cup, heart latte art -->
  <div class="card">
    <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="fwCer" cx="28%" cy="20%" r="80%">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="25%" stop-color="#F5ECD8"/>
          <stop offset="100%" stop-color="#C0A478"/>
        </radialGradient>
        <radialGradient id="fwFoam" cx="36%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="40%" stop-color="#F6EFE0"/>
          <stop offset="100%" stop-color="#DAD0B2"/>
        </radialGradient>
        <radialGradient id="fwSaucer" cx="35%" cy="28%" r="70%">
          <stop offset="0%" stop-color="#F4E8C8"/>
          <stop offset="100%" stop-color="#BCA070"/>
        </radialGradient>
      </defs>
      <!-- steam subtle -->
      <path d="M62,62 Q66,52 62,42 Q58,32 62,22" stroke="#C8A84A" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.32"/>
      <path d="M78,60 Q82,50 78,40 Q74,30 78,20" stroke="#C8A84A" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.28"/>
      <!-- saucer shadow -->
      <ellipse cx="70" cy="154" rx="60" ry="8" fill="#3b2a1a" opacity="0.08"/>
      <!-- saucer -->
      <ellipse cx="70" cy="149" rx="57" ry="9" fill="url(#fwSaucer)"/>
      <ellipse cx="70" cy="146" rx="44" ry="6.5" fill="#EDE0C0"/>
      <!-- cup shadow -->
      <ellipse cx="70" cy="142" rx="32" ry="5" fill="#3b2a1a" opacity="0.07"/>
      <!-- cup body — wide low round belly -->
      <path d="M34,138 Q34,146 70,148 Q106,146 106,138 L108,72 Q70,62 32,72 Z" fill="url(#fwCer)"/>
      <!-- handle: filled D-ring -->
      <path d="M106,94 Q130,94 130,108 Q130,122 106,120 L106,112 Q120,111 120,108 Q120,105 106,104 Z" fill="url(#fwCer)"/>
      <!-- cup interior -->
      <ellipse cx="70" cy="72" rx="36" ry="9.5" fill="#1A0904"/>
      <!-- foam surface -->
      <ellipse cx="70" cy="72" rx="34" ry="8.5" fill="url(#fwFoam)"/>
      <!-- latte art heart — brown, perspective-squashed -->
      <path d="M70,80 C66,73 55,71 55,77 C55,83 70,89 70,89 C70,89 85,83 85,77 C85,71 74,73 70,80 Z" fill="#7A3818" opacity="0.6"/>
      <!-- foam glint -->
      <ellipse cx="56" cy="69" rx="9" ry="2.5" fill="#FFFFFF" opacity="0.38"/>
    </svg>
    <div class="label">Flat White</div>
    <div class="sub">With Latte Art</div>
  </div>

  <!-- ── CAPPUCCINO ── same cup, foam dome, cocoa dust -->
  <div class="card">
    <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="capCer" cx="28%" cy="20%" r="80%">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="25%" stop-color="#F5ECD8"/>
          <stop offset="100%" stop-color="#C0A478"/>
        </radialGradient>
        <radialGradient id="capFoam" cx="36%" cy="28%" r="68%">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="35%" stop-color="#F8F2E4"/>
          <stop offset="100%" stop-color="#E2D6BA"/>
        </radialGradient>
        <radialGradient id="capSaucer" cx="35%" cy="28%" r="70%">
          <stop offset="0%" stop-color="#F4E8C8"/>
          <stop offset="100%" stop-color="#BCA070"/>
        </radialGradient>
      </defs>
      <!-- steam — more, cappuccino is hot -->
      <path d="M52,42 Q56,32 52,22 Q48,12 52,2" stroke="#C8A84A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.38"/>
      <path d="M70,40 Q74,30 70,20 Q66,10 70,0" stroke="#C8A84A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.38"/>
      <path d="M88,42 Q92,32 88,22 Q84,12 88,2" stroke="#C8A84A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.28"/>
      <!-- saucer shadow -->
      <ellipse cx="70" cy="154" rx="60" ry="8" fill="#3b2a1a" opacity="0.08"/>
      <!-- saucer -->
      <ellipse cx="70" cy="149" rx="57" ry="9" fill="url(#capSaucer)"/>
      <ellipse cx="70" cy="146" rx="44" ry="6.5" fill="#EDE0C0"/>
      <!-- cup shadow -->
      <ellipse cx="70" cy="142" rx="32" ry="5" fill="#3b2a1a" opacity="0.07"/>
      <!-- cup body — same as flat white -->
      <path d="M34,138 Q34,146 70,148 Q106,146 106,138 L108,72 Q70,62 32,72 Z" fill="url(#capCer)"/>
      <!-- handle: filled D-ring -->
      <path d="M106,94 Q130,94 130,108 Q130,122 106,120 L106,112 Q120,111 120,108 Q120,105 106,104 Z" fill="url(#capCer)"/>
      <!-- foam dome — rises above the rim, no interior visible -->
      <path d="M32,74 Q34,38 70,36 Q106,38 108,74 Q70,80 32,74 Z" fill="url(#capFoam)"/>
      <!-- foam dome top highlight -->
      <ellipse cx="58" cy="52" rx="18" ry="8" fill="#FFFFFF" opacity="0.32"/>
      <!-- cocoa dust -->
      <circle cx="64" cy="52" r="1.8" fill="#8B4820" opacity="0.52"/>
      <circle cx="74" cy="47" r="2.1" fill="#8B4820" opacity="0.48"/>
      <circle cx="85" cy="52" r="1.8" fill="#8B4820" opacity="0.52"/>
      <circle cx="70" cy="58" r="1.5" fill="#8B4820" opacity="0.42"/>
      <circle cx="58" cy="60" r="1.4" fill="#8B4820" opacity="0.38"/>
      <circle cx="82" cy="59" r="1.4" fill="#8B4820" opacity="0.38"/>
      <circle cx="70" cy="44" r="2.3" fill="#8B4820" opacity="0.42"/>
    </svg>
    <div class="label">Cappuccino</div>
    <div class="sub">Italian Style</div>
  </div>

  <!-- ── CORTADO ── small terracotta cup, caramel surface -->
  <div class="card">
    <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="cortCer" cx="28%" cy="20%" r="80%">
          <stop offset="0%" stop-color="#F09A78"/>
          <stop offset="38%" stop-color="#C85A3C"/>
          <stop offset="100%" stop-color="#782A18"/>
        </radialGradient>
        <radialGradient id="cortSurface" cx="34%" cy="32%" r="65%">
          <stop offset="0%" stop-color="#D49A40"/>
          <stop offset="58%" stop-color="#A07020"/>
          <stop offset="100%" stop-color="#5C3A0C"/>
        </radialGradient>
        <radialGradient id="cortSaucer" cx="35%" cy="28%" r="70%">
          <stop offset="0%" stop-color="#F4E8C8"/>
          <stop offset="100%" stop-color="#BCA070"/>
        </radialGradient>
      </defs>
      <!-- steam -->
      <path d="M60,86 Q64,76 60,66 Q56,56 60,46" stroke="#C8A84A" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.38"/>
      <path d="M76,84 Q80,74 76,64 Q72,54 76,44" stroke="#C8A84A" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.33"/>
      <!-- saucer shadow -->
      <ellipse cx="70" cy="152" rx="50" ry="7" fill="#3b2a1a" opacity="0.08"/>
      <!-- saucer -->
      <ellipse cx="70" cy="147" rx="47" ry="8.5" fill="url(#cortSaucer)"/>
      <ellipse cx="70" cy="144" rx="36" ry="6" fill="#EDE0C0"/>
      <!-- cup shadow -->
      <ellipse cx="70" cy="141" rx="27" ry="4.5" fill="#3b2a1a" opacity="0.08"/>
      <!-- cup body — smaller than flat white, terracotta -->
      <path d="M44,135 Q44,143 70,145 Q96,143 96,135 L98,90 Q70,82 42,90 Z" fill="url(#cortCer)"/>
      <!-- handle: filled D-ring -->
      <path d="M96,104 Q118,104 118,115 Q118,126 96,124 L96,117 Q108,116 108,115 Q108,114 96,113 Z" fill="url(#cortCer)"/>
      <!-- cup interior -->
      <ellipse cx="70" cy="90" rx="28" ry="8" fill="#180A04"/>
      <!-- caramel surface -->
      <ellipse cx="70" cy="90" rx="26" ry="7" fill="url(#cortSurface)"/>
      <!-- milk foam ring -->
      <ellipse cx="70" cy="90" rx="26" ry="7" fill="none" stroke="#F0E0B8" stroke-width="4.5" opacity="0.38"/>
      <!-- glint -->
      <ellipse cx="58" cy="88" rx="7" ry="2" fill="#F5E8D0" opacity="0.32"/>
    </svg>
    <div class="label">Cortado</div>
    <div class="sub">Equal Parts</div>
  </div>

  <!-- ── TEA ── tall sage green mug, amber tea, teabag -->
  <div class="card">
    <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="teaMug" cx="28%" cy="20%" r="80%">
          <stop offset="0%" stop-color="#C8E2A0"/>
          <stop offset="38%" stop-color="#7EB85E"/>
          <stop offset="100%" stop-color="#386828"/>
        </radialGradient>
        <radialGradient id="teaLiq" cx="34%" cy="32%" r="65%">
          <stop offset="0%" stop-color="#E2AA32"/>
          <stop offset="58%" stop-color="#B07C20"/>
          <stop offset="100%" stop-color="#684810"/>
        </radialGradient>
      </defs>
      <!-- steam -->
      <path d="M58,50 Q62,40 58,30 Q54,20 58,10" stroke="#8EC858" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.38"/>
      <path d="M74,48 Q78,38 74,28 Q70,18 74,8" stroke="#8EC858" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.33"/>
      <!-- teabag string over the rim -->
      <path d="M80,62 Q94,56 100,46 Q106,37 108,28" stroke="#4A3010" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <!-- tag -->
      <rect x="102" y="21" width="14" height="10" rx="2" fill="#E8D4A0"/>
      <line x1="105" y1="25" x2="113" y2="25" stroke="#C0A060" stroke-width="0.9" opacity="0.7"/>
      <line x1="105" y1="28" x2="113" y2="28" stroke="#C0A060" stroke-width="0.9" opacity="0.7"/>
      <!-- mug shadow -->
      <ellipse cx="70" cy="154" rx="38" ry="6.5" fill="#3b2a1a" opacity="0.08"/>
      <!-- mug body — taller, more cylindrical than coffee cups -->
      <path d="M38,146 Q38,154 70,156 Q102,154 102,146 L102,64 Q70,56 38,64 Z" fill="url(#teaMug)"/>
      <!-- handle: bigger D-ring for mug -->
      <path d="M102,88 Q134,88 134,110 Q134,132 102,130 L102,120 Q122,118 122,110 Q122,102 102,100 Z" fill="url(#teaMug)"/>
      <!-- mug base -->
      <ellipse cx="70" cy="146" rx="32" ry="8" fill="#2E5820" opacity="0.55"/>
      <!-- rim opening -->
      <ellipse cx="70" cy="64" rx="32" ry="8.5" fill="#1A1008"/>
      <!-- tea surface -->
      <ellipse cx="70" cy="64" rx="30" ry="7.5" fill="url(#teaLiq)"/>
      <!-- tea glint -->
      <ellipse cx="57" cy="62" rx="8" ry="2.2" fill="#F2C050" opacity="0.28"/>
      <!-- teabag submerged -->
      <rect x="64" y="60" width="11" height="8" rx="2" fill="#4A2C0C" opacity="0.58"/>
    </svg>
    <div class="label">Tea</div>
    <div class="sub">Brewed Leaf</div>
  </div>

  <!-- ── MATCHA ── wide jade chawan bowl, frothy surface -->
  <div class="card">
    <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="matchaOuter" cx="28%" cy="22%" r="76%">
          <stop offset="0%" stop-color="#82CC42"/>
          <stop offset="48%" stop-color="#3E8A1E"/>
          <stop offset="100%" stop-color="#1A5008"/>
        </radialGradient>
        <radialGradient id="matchaInner" cx="34%" cy="28%" r="70%">
          <stop offset="0%" stop-color="#2A6414"/>
          <stop offset="100%" stop-color="#0C3006"/>
        </radialGradient>
        <radialGradient id="matchaSurf" cx="36%" cy="34%" r="65%">
          <stop offset="0%" stop-color="#B4EC50"/>
          <stop offset="52%" stop-color="#6CB428"/>
          <stop offset="100%" stop-color="#2E6410"/>
        </radialGradient>
      </defs>
      <!-- bowl shadow -->
      <ellipse cx="80" cy="155" rx="64" ry="8" fill="#3b2a1a" opacity="0.08"/>
      <!-- bowl outer -->
      <path d="M16,136 Q16,152 80,155 Q144,152 144,136 L138,104 Q80,96 22,104 Z" fill="url(#matchaOuter)"/>
      <!-- bowl inner walls -->
      <path d="M24,133 Q24,148 80,151 Q136,148 136,133 L132,106 Q80,100 28,106 Z" fill="url(#matchaInner)"/>
      <!-- matcha surface -->
      <ellipse cx="80" cy="106" rx="52" ry="13" fill="url(#matchaSurf)"/>
      <!-- froth bubbles -->
      <circle cx="66" cy="103" r="3.2" fill="#C8F058" opacity="0.38"/>
      <circle cx="80" cy="100" r="3.8" fill="#D0F860" opacity="0.35"/>
      <circle cx="94" cy="103" r="3.2" fill="#C8F058" opacity="0.38"/>
      <circle cx="73" cy="109" r="2.6" fill="#A8E040" opacity="0.40"/>
      <circle cx="87" cy="110" r="2.6" fill="#A8E040" opacity="0.40"/>
      <circle cx="60" cy="108" r="2.2" fill="#98D838" opacity="0.36"/>
      <circle cx="100" cy="107" r="2.2" fill="#98D838" opacity="0.36"/>
      <circle cx="80" cy="114" r="2" fill="#88CC30" opacity="0.35"/>
      <!-- surface glint -->
      <ellipse cx="64" cy="102" rx="13" ry="3.5" fill="#E0FF90" opacity="0.2"/>
      <!-- bowl rim highlight -->
      <path d="M24,136 Q80,142 136,136" stroke="#88D038" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.38"/>
    </svg>
    <div class="label">Matcha</div>
    <div class="sub">Ceremonial Grade</div>
  </div>

  <!-- ── FILTER COFFEE / V60 ── white cone, glass server -->
  <div class="card">
    <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="v60Cer" cx="28%" cy="22%" r="76%">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="28%" stop-color="#F2E8D4"/>
          <stop offset="100%" stop-color="#C4B08A"/>
        </radialGradient>
        <radialGradient id="v60Paper" cx="34%" cy="28%" r="68%">
          <stop offset="0%" stop-color="#F0E6CC"/>
          <stop offset="100%" stop-color="#D2C29A"/>
        </radialGradient>
        <radialGradient id="v60Grinds" cx="35%" cy="32%" r="65%">
          <stop offset="0%" stop-color="#4A2210"/>
          <stop offset="100%" stop-color="#160803"/>
        </radialGradient>
        <radialGradient id="v60Glass" cx="28%" cy="22%" r="75%">
          <stop offset="0%" stop-color="#EEF6FA" stop-opacity="0.75"/>
          <stop offset="60%" stop-color="#C4DCE8" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#8AAEC0" stop-opacity="0.65"/>
        </radialGradient>
        <radialGradient id="v60Brew" cx="34%" cy="34%" r="62%">
          <stop offset="0%" stop-color="#5A2E16"/>
          <stop offset="100%" stop-color="#200C04"/>
        </radialGradient>
      </defs>
      <!-- glass server -->
      <path d="M48,150 Q48,158 80,160 Q112,158 112,150 L114,122 Q80,114 46,122 Z" fill="#B8A888" opacity="0.25"/>
      <path d="M48,150 Q48,158 80,160 Q112,158 112,150 L114,122 Q80,114 46,122 Z" fill="url(#v60Glass)"/>
      <!-- brewed coffee in server -->
      <path d="M50,150 Q50,156 80,158 Q110,156 110,150 L112,134 Q80,128 48,134 Z" fill="url(#v60Brew)" opacity="0.88"/>
      <!-- server rim -->
      <ellipse cx="80" cy="122" rx="34" ry="8.5" fill="#A8987A" opacity="0.55"/>
      <ellipse cx="80" cy="120" rx="32" ry="7" fill="#CEBEA0" opacity="0.45"/>
      <!-- stand ring -->
      <ellipse cx="80" cy="110" rx="20" ry="4.5" fill="none" stroke="#8A7850" stroke-width="4"/>
      <rect x="74" y="106" width="12" height="18" rx="3" fill="#6A5838"/>
      <!-- V60 cone outer -->
      <path d="M24,66 Q24,52 80,49 Q136,52 136,66 L80,114 Z" fill="url(#v60Cer)"/>
      <!-- paper filter -->
      <path d="M32,68 Q32,56 80,53 Q128,56 128,68 L80,110 Z" fill="url(#v60Paper)"/>
      <!-- coffee grounds -->
      <path d="M52,72 Q52,62 80,59 Q108,62 108,72 L80,106 Z" fill="url(#v60Grinds)" opacity="0.88"/>
      <!-- cone rim -->
      <ellipse cx="80" cy="66" rx="56" ry="12" fill="#D4C4A0"/>
      <ellipse cx="80" cy="64" rx="54" ry="10.5" fill="#E6D8B8"/>
      <!-- ribs converging to tip -->
      <line x1="80" y1="110" x2="46" y2="68" stroke="#D8C8A4" stroke-width="0.9" opacity="0.48"/>
      <line x1="80" y1="110" x2="56" y2="64" stroke="#D8C8A4" stroke-width="0.9" opacity="0.48"/>
      <line x1="80" y1="110" x2="68" y2="61" stroke="#D8C8A4" stroke-width="0.9" opacity="0.48"/>
      <line x1="80" y1="110" x2="92" y2="61" stroke="#D8C8A4" stroke-width="0.9" opacity="0.48"/>
      <line x1="80" y1="110" x2="104" y2="64" stroke="#D8C8A4" stroke-width="0.9" opacity="0.48"/>
      <line x1="80" y1="110" x2="114" y2="68" stroke="#D8C8A4" stroke-width="0.9" opacity="0.48"/>
      <!-- drip -->
      <path d="M80,110 L80,118" stroke="#2A1008" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <ellipse cx="80" cy="119" rx="2" ry="2.5" fill="#2A1008" opacity="0.6"/>
    </svg>
    <div class="label">Filter Coffee</div>
    <div class="sub">V60 Pour Over</div>
  </div>

</div>
</body>
</html>
