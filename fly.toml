app = "drinkbro"
primary_region = "ams"

[build]

[env]
  NODE_ENV = "production"
  DB_PATH = "/data/orders.db"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "drinkbro_data"
  destination = "/data"
  initial_size = "1gb"
